name: Bug report
description: Something in the threat map or backend is not working as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security vulnerabilities here; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with `cd server && npm start`
        2. Start the frontend with `cd client && npm start`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (globe, HUD, legend)
        - Backend (polling, GeoIP, Socket.IO)
        - CI / GitHub Actions
        - Deployment (Render)
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Production (Render)
        - CI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, health output or screenshots
      description: Backend console output, `GET /health` response, browser console errors, etc.
      render: text
