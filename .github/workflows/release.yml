name: Release

# Builds and validates release artifacts. It NEVER deploys: production on
# Render is deployed manually after the draft release has been reviewed.
#
#   push to release/vX.Y.Z  -> dry run: verify + full CI + package (no release created)
#   push tag vX.Y.Z         -> verify + full CI + package + create a DRAFT GitHub Release
#   manual run              -> dry run for the version you enter
# See docs/RELEASE.md for the full process.
on:
  push:
    branches: ['release/v*']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run (e.g. 1.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release half-way

jobs:
  verify:
    name: Verify version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"
          else v="${REF_NAME#release/}"; fi
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

      - name: Check package versions and CHANGELOG entry
        run: node scripts/verify-release.js "${{ steps.version.outputs.version }}"

  ci:
    name: Full CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: Package artifacts
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only used to create the draft release on tag pushes
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download client build produced by CI
        uses: actions/download-artifact@v8
        with:
          name: client-build-${{ github.sha }}
          path: client-build

      - name: Create release archives and checksums
        run: |
          mkdir -p dist
          tar -czf "dist/cyberthreatmap-client-build-v${VERSION}.tar.gz" -C client-build .
          # Server source exactly as committed (no node_modules); install with `npm ci`.
          git archive --format=tar.gz --prefix="cyberthreatmap-server-v${VERSION}/" \
            -o "dist/cyberthreatmap-server-v${VERSION}.tar.gz" HEAD server
          node scripts/verify-release.js "$VERSION" --notes > dist/RELEASE_NOTES.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -l dist
          {
            echo "## Release v${VERSION} artifacts"
            echo '```'; cat dist/SHA256SUMS.txt; echo '```'
            echo "### Release notes"; cat dist/RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-v${{ env.VERSION }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Create DRAFT GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "CyberThreatMap $TAG" \
            --notes-file dist/RELEASE_NOTES.md
          echo "Draft release created. Review it, deploy manually, then publish." >> "$GITHUB_STEP_SUMMARY"
