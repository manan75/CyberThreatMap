name: CI

# Runs on every push to any branch and on every pull request into main,
# so problems are caught before code is integrated.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server - test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Unit tests with coverage (external APIs mocked)
        run: npm run test:coverage

      - name: Smoke test - start server and check /health
        run: |
          NODE_ENV=test PORT=4000 node index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4000/health | tee health.json | grep -q '"status":"ok"'; then
              echo; echo "Health check passed:"; cat health.json; exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy. Log:"; cat server.log; exit 1

  client:
    name: Client - lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    env:
      CI: true # makes Jest run once and turns build warnings into errors
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (globe and socket mocked)
        run: npm test -- --watchAll=false

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-build-${{ github.sha }}
          path: client/build
          retention-days: 7
          if-no-files-found: error

  # Single, stable check name to mark as "required" in branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs passed."
